<script>
  /* Apply the saved (or system) theme before the page paints, to avoid a flash */
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('theme'); } catch (e) {}
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<style>
  body {
    font-family: "Inter", "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "kern", "liga", "calt";
  }
  .page__content {
    font-size: 1rem;
    line-height: 1.7;
    color: #2a2a2a;
  }
  .page__content p { margin-bottom: 1.15em; }
  .page__content h1, .page__content h2, .page__content h3 {
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #1a1a1a;
  }
  .page__content h2 {
    margin-top: 2em;
    margin-bottom: 0.6em;
    padding-bottom: 0.3em;
    border-bottom: 1px solid #e6e6e6;
    font-size: 1.25rem;
  }
  .page__content hr {
    border: 0;
    border-top: 1px solid #e6e6e6;
    margin: 2em 0;
  }
  .page__content a {
    color: #2563EB;
    text-decoration: none;
    border-bottom: 1px solid rgba(37, 99, 235, 0.25);
    transition: border-color 0.15s ease;
  }
  .page__content a:hover {
    border-bottom-color: #2563EB;
  }
  .author__name { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 600; }
  .author__bio  { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; }

  /* Force a clean circular profile photo (was rendering oval because the source is not square) */
  .author__avatar img {
    width: 175px;
    height: 175px;
    max-width: 175px;
    object-fit: cover;
    object-position: center top;
    border-radius: 50%;
    aspect-ratio: 1 / 1;
  }

  /* Navbar */
  .masthead {
    background: #2563EB;
    border-bottom: none;
  }
  .masthead__inner-wrap { color: #ffffff; }
  .greedy-nav { background: transparent; }
  .greedy-nav,
  .greedy-nav a,
  .greedy-nav .visible-links a,
  .masthead__menu-item a {
    color: #ffffff !important;
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .greedy-nav a:hover {
    color: #dbeafe !important;
  }
  .greedy-nav .visible-links a:before {
    background: #ffffff;
  }
  .greedy-nav button {
    background: #2563EB;
  }
  .greedy-nav button .navicon,
  .greedy-nav button .navicon:before,
  .greedy-nav button .navicon:after {
    background: #ffffff;
  }

  /* Theme toggle button (sits at the right edge of the navbar) */
  .masthead__inner-wrap {
    position: relative;
    padding-right: 3.5em;
  }
  .theme-toggle {
    position: absolute;
    top: 50%;
    right: 1em;
    transform: translateY(-50%);
    width: 2.25em;
    height: 2.25em;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #ffffff;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  .theme-toggle:hover { background: rgba(255, 255, 255, 0.15); }
  .theme-toggle:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
  .theme-toggle__icon--sun { display: none; }
  html[data-theme="dark"] .theme-toggle__icon--sun { display: inline-block; }
  html[data-theme="dark"] .theme-toggle__icon--moon { display: none; }

  /* ---------- Dark theme ---------- */
  html[data-theme="dark"] {
    color-scheme: dark;
    background: #121417;
  }
  html[data-theme="dark"] body {
    background: #121417;
    color: #c9cdd2;
  }
  html[data-theme="dark"] .masthead,
  html[data-theme="dark"] .greedy-nav button {
    background: #1e3a8a;
  }
  html[data-theme="dark"] .greedy-nav .hidden-links {
    background: #1b1f24;
    border-color: #2c3138;
  }
  html[data-theme="dark"] .page__content { color: #d4d7dc; }
  html[data-theme="dark"] .page__content h1,
  html[data-theme="dark"] .page__content h2,
  html[data-theme="dark"] .page__content h3,
  html[data-theme="dark"] .page__title,
  html[data-theme="dark"] .author__name {
    color: #f1f3f5;
  }
  html[data-theme="dark"] .page__content h2,
  html[data-theme="dark"] .page__content hr,
  html[data-theme="dark"] hr {
    border-color: #2c3138;
  }
  html[data-theme="dark"] .page__content a { color: #7aa7ff; border-bottom-color: rgba(122, 167, 255, 0.3); }
  html[data-theme="dark"] .page__content a:hover { border-bottom-color: #7aa7ff; }
  html[data-theme="dark"] a { color: #7aa7ff; }
  html[data-theme="dark"] .author__urls a,
  html[data-theme="dark"] .page__footer a { color: inherit; }
  html[data-theme="dark"] .author__bio,
  html[data-theme="dark"] .author__urls { color: #aab0b7; }
  html[data-theme="dark"] .author__urls {
    background: #1b1f24;
    border-color: #2c3138;
  }
  html[data-theme="dark"] .author__urls:before { border-color: #2c3138 transparent; }
  html[data-theme="dark"] .author__urls:after { border-color: #1b1f24 transparent; }
  html[data-theme="dark"] .btn--inverse {
    color: #c9cdd2 !important;
    background-color: #1b1f24;
    border-color: #3a4048 !important;
  }
  html[data-theme="dark"] .btn--inverse:hover { background-color: #2c3138; }
  html[data-theme="dark"] .page__footer {
    background-color: #181b1f;
    border-top-color: #2c3138;
    color: #8f969e;
  }
  html[data-theme="dark"] .page__footer .fas,
  html[data-theme="dark"] .page__footer .fab { color: #8f969e; }
  html[data-theme="dark"] code,
  html[data-theme="dark"] pre {
    background: #1b1f24;
    border-color: #2c3138;
    color: #d4d7dc;
  }
  html[data-theme="dark"] table { border-color: #2c3138; }
  html[data-theme="dark"] th { background-color: #1b1f24; }
  html[data-theme="dark"] td,
  html[data-theme="dark"] th { border-color: #2c3138; }
  html[data-theme="dark"] blockquote { border-left-color: #4b5563; }
  html[data-theme="dark"] .social-icons .fa-github,
  html[data-theme="dark"] .social-icons .fa-github-alt,
  html[data-theme="dark"] .social-icons .fa-github-square { color: #e6e8eb; }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    var meta = document.querySelector('meta[name="theme-color"]');

    function apply(theme) {
      root.setAttribute('data-theme', theme);
      var next = theme === 'dark' ? 'light' : 'dark';
      if (btn) {
        btn.setAttribute('aria-label', 'Switch to ' + next + ' theme');
        btn.setAttribute('title', 'Switch to ' + next + ' theme');
      }
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#1e3a8a' : '#2563EB');
    }

    apply(root.getAttribute('data-theme') || 'light');

    if (btn) {
      btn.addEventListener('click', function () {
        var theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', theme); } catch (e) {}
        apply(theme);
      });
    }

    /* Follow the OS setting until the visitor picks a theme themselves */
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onChange = function (e) {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (err) {}
        if (!saved) apply(e.matches ? 'dark' : 'light');
      };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
  });
</script>
