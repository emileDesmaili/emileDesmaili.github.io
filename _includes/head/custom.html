{% include base_path %}

<!-- start custom head snippets -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/princeton-shield-32.png">
<link rel="icon" type="image/png" sizes="196x196" href="{{ base_path }}/images/princeton-shield-196.png">
<meta name="theme-color" content="#2563EB">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<style>
  body {
    font-family: "Inter", "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "kern", "liga", "calt";
  }
  .page__content {
    font-size: 1rem;
    line-height: 1.7;
    color: #2a2a2a;
  }
  .page__content p { margin-bottom: 1.15em; }
  .page__content h1, .page__content h2, .page__content h3 {
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #1a1a1a;
  }
  .page__content h2 {
    margin-top: 2em;
    margin-bottom: 0.6em;
    padding-bottom: 0.3em;
    border-bottom: 1px solid #e6e6e6;
    font-size: 1.25rem;
  }
  .page__content hr {
    border: 0;
    border-top: 1px solid #e6e6e6;
    margin: 2em 0;
  }
  .page__content a {
    color: #2563EB;
    text-decoration: none;
    border-bottom: 1px solid rgba(37, 99, 235, 0.25);
    transition: border-color 0.15s ease;
  }
  .page__content a:hover {
    border-bottom-color: #2563EB;
  }
  .author__name { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 600; }
  .author__bio  { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; }

  /* Force a clean circular profile photo (was rendering oval because the source is not square) */
  .author__avatar img {
    width: 175px;
    height: 175px;
    max-width: 175px;
    object-fit: cover;
    object-position: center top;
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    transition: opacity 0.25s ease;
  }
  .author__avatar img.is-fading { opacity: 0; }

  /* Portrait style switcher: palette badge on the photo */
  .portrait { position: relative; display: inline-block; }
  .portrait__btn {
    position: absolute;
    right: 8px;
    bottom: 8px;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 2px solid #ffffff;
    border-radius: 50%;
    background: #2563EB;
    color: #ffffff;
    font-size: 16px;
    line-height: 34px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .portrait__btn:hover { background: #1d4ed8; transform: rotate(-15deg) scale(1.08); }
  .portrait__btn:focus-visible { outline: 2px solid #2563EB; outline-offset: 2px; }
  .portrait__caption {
    margin: 0.4em 0 0;
    min-height: 1.2em;
    font-size: 0.75em;
    font-style: italic;
    color: #6b7280;
  }

  /* Navbar */
  /* Ocean banner: brand blue on the left dissolving into the aerial ocean photo,
     which itself fades into the white page at the bottom. */
  .masthead {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0) 45%, #ffffff 100%),
      linear-gradient(90deg, rgba(37, 99, 235, 0.95) 0%, rgba(37, 99, 235, 0.6) 35%, rgba(37, 99, 235, 0) 70%),
      #0e7490 url("{{ base_path }}/images/ocean.jpg") center 45% / cover no-repeat;
    border-bottom: none;
  }
  .masthead__inner-wrap { padding-bottom: 5em; }
  @media (max-width: 768px) {
    .masthead__inner-wrap { padding-bottom: 2.5em; }
  }
  .greedy-nav a { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35); }
  .masthead__inner-wrap { color: #ffffff; }
  .greedy-nav { background: transparent; }
  .greedy-nav,
  .greedy-nav a,
  .greedy-nav .visible-links a,
  .masthead__menu-item a {
    color: #ffffff !important;
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .greedy-nav a:hover {
    color: #dbeafe !important;
  }
  .greedy-nav .visible-links a:before {
    background: #ffffff;
  }
  .greedy-nav button {
    background: rgba(37, 99, 235, 0.85);
    border-radius: 6px;
  }
  .greedy-nav button .navicon,
  .greedy-nav button .navicon:before,
  .greedy-nav button .navicon:after {
    background: #ffffff;
  }
</style>

<!-- end custom head snippets -->
